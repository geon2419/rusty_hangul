[package]
name = "hangul-wasm"
version = "0.1.1"
edition = "2021"
description = "WebAssembly bindings for hangul library"
authors = ["ghlee"]
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
rusty_hangul = { path = "../core" }
js-sys = "0.3"

[dev-dependencies]
wasm-bindgen-test = "0.3"

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-O3", "--enable-mutable-globals"]
